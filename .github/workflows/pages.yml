name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # The icon pack's licence forbids redistributing the sheet itself, so it
      # lives in a repository secret and is only placed into the built game.
      - name: Add licensed icon sheet
        env:
          CF_ICONS_B64: ${{ secrets.CF_ICONS_B64 }}
        run: |
          mkdir -p public/assets
          if [ -n "$CF_ICONS_B64" ]; then
            printf '%s' "$CF_ICONS_B64" | base64 -d > public/assets/cf-icons-16.png
            echo "Icon sheet added."
          else
            echo "::warning::CF_ICONS_B64 secret not set; icons will show as markers."
          fi

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
